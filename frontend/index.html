<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flui-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4ef" />
    <title>Flui Contratos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Must run before any module JS so we capture the hash before Supabase clears it -->
    <script>
      if (window.location.hash.includes('type=invite')) {
        sessionStorage.setItem('supabase_invite_flow', 'true');
      }
      if (window.location.hash.includes('type=recovery')) {
        sessionStorage.setItem('supabase_recovery_flow', 'true');
      }
      if (window.location.hash.includes('error_code=otp_expired')) {
        sessionStorage.setItem('supabase_link_expired', 'true');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
