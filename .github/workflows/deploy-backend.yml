name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Pull requests run only the test job (unit + coverage gate + e2e), so a red
  # suite shows up on the PR before it is merged (INFRA-13). No deploy. No paths
  # filter here: `test` is a required check on main, so it must report on every
  # PR, or a PR that doesn't touch the backend would wait for it forever.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Unit tests + coverage gate
        working-directory: backend
        run: npm run test:cov

      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e

  build-and-deploy:
    # Gate the deploy on the test job: no green tests + coverage floor, no deploy.
    needs: test
    if: github.event_name != 'pull_request'
    # One deploy at a time: a newer push waits instead of racing the package URL.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install all dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Install production dependencies only
        working-directory: backend
        run: npm ci --omit=dev

      - name: Create deployment zip
        run: |
          cd backend
          zip -r ../deploy.zip dist node_modules package.json
          echo "Zip size: $(du -sh ../deploy.zip | cut -f1)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload zip and update WEBSITE_RUN_FROM_PACKAGE
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name fluigj2026dev \
            --resource-group flui-dev \
            --query "[0].value" -o tsv)

          az storage blob upload \
            --account-name fluigj2026dev \
            --container-name deployments \
            --name backend/deploy.zip \
            --file deploy.zip \
            --overwrite \
            --account-key "$STORAGE_KEY"

          # The App Service re-reads this URL on every (re)start, so the SAS must
          # outlive the gap between deploys — a 7-day SAS took the API down (503)
          # the first time it restarted a week after the last deploy.
          EXPIRY=$(date -u -d "+365 days" +"%Y-%m-%dT%H:%MZ")
          SAS_URL=$(az storage blob generate-sas \
            --account-name fluigj2026dev \
            --container-name deployments \
            --name backend/deploy.zip \
            --permissions r \
            --expiry "$EXPIRY" \
            --account-key "$STORAGE_KEY" \
            --full-uri \
            --output tsv)

          az webapp config appsettings set \
            --resource-group flui-dev \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --settings "WEBSITE_RUN_FROM_PACKAGE=$SAS_URL"

          echo "Deployed. Package URL updated."
