name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install all dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Install production dependencies only
        working-directory: backend
        run: npm ci --omit=dev

      - name: Create deployment zip
        run: |
          cd backend
          zip -r ../deploy.zip dist node_modules package.json
          echo "Zip size: $(du -sh ../deploy.zip | cut -f1)"

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload zip and update WEBSITE_RUN_FROM_PACKAGE
        run: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name fluigj2026dev \
            --resource-group flui-dev \
            --query "[0].value" -o tsv)

          az storage blob upload \
            --account-name fluigj2026dev \
            --container-name deployments \
            --name backend/deploy.zip \
            --file deploy.zip \
            --overwrite \
            --account-key "$STORAGE_KEY"

          EXPIRY=$(date -u -d "+7 days" +"%Y-%m-%dT%H:%MZ")
          SAS_URL=$(az storage blob generate-sas \
            --account-name fluigj2026dev \
            --container-name deployments \
            --name backend/deploy.zip \
            --permissions r \
            --expiry "$EXPIRY" \
            --account-key "$STORAGE_KEY" \
            --full-uri \
            --output tsv)

          az webapp config appsettings set \
            --resource-group flui-dev \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --settings "WEBSITE_RUN_FROM_PACKAGE=$SAS_URL"

          echo "Deployed. Package URL updated."
